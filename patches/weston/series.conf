# weston 补丁序列的基线信息。apply.sh 与 regenerate.sh 都 source 本文件。
#
# 升级基线的流程：
#   1. 把 WESTON_BASE 改成新的 microsoft/weston-mirror working 分支提交
#   2. 运行 ./patches/weston/regenerate.sh 重新生成 *.patch（会自动改写下面的 EXPECTED_TREE）
#   3. 提交 patches/weston/ 下的全部改动

WESTON_REPO=https://github.com/microsoft/weston-mirror
WESTON_BRANCH=working

# 补丁序列所基于的上游提交（working 分支 2026-10-13 的 HEAD）
WESTON_BASE=7fbf69314f8a74450c265650232f66f59a4e0630

# 全部补丁套用后 `git write-tree` 的期望值，apply.sh 用它校验结果是否完整、未被篡改
EXPECTED_TREE=5f96a8aee525cabbae26ab0f6d478074f1200c91
